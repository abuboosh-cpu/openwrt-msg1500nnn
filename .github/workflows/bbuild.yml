name: Build OpenWrt for Raisecom MSG1500 - Custom Channels

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
        file wget swig time

    - name: Clone OpenWrt Source
      run: |
        git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Unlock Regulatory Domain & Bypass Channel Restrictions
      run: |
        cd openwrt
        # Force worldwide regulatory domain to allow unrestricted frequency ranges
        sed -i 's/country 00:/country 00:\n\t(5150 - 5850 @ 80), (23), NO-IR/g' package/firmware/wireless-regdb/db.txt || true
        sed -i 's/world/00/g' package/firmware/wireless-regdb/Makefile || true

    - name: Generate Device Configuration
      run: |
        cd openwrt
        cat <<EOF > .config
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_raisecom_msg1500-x-00=y
        CONFIG_PACKAGE_kmod-mt7615e=y
        CONFIG_PACKAGE_kmod-mt7615-firmware=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_wpad-openssl=y
        EOF
        make defconfig

    - name: Compile OpenWrt Firmware
      run: |
        cd openwrt
        make -j$(nproc) V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RAISECOM-MSG1500-Custom-Channels-Firmware
        path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin
